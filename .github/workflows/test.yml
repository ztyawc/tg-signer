name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
        extras: ['', '[gui,yaml]']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".${{ matrix.extras }}"
          pip install --group dev
      - name: Lint
        run: |
          ruff check

      - name: Run tests
        run: |
          pytest -W=ignore::DeprecationWarning:pyrogram.sync -vv tests/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[gui,yaml]'
          pip install --group dev --group browser
          python -m playwright install --with-deps chromium
      - name: Run browser regressions
        run: pytest -vv tests/test_webui_browser.py
